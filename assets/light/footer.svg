<svg xmlns="http://www.w3.org/2000/svg" width="900" height="110" viewBox="0 0 900 110">
  <defs>
    <linearGradient id="l" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="840" y2="0">
      <stop offset="0" stop-color="#8C6A1A" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A67C1A"/>
      <stop offset="1" stop-color="#8C6A1A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#7A5A12"/>
      <stop offset="0.5" stop-color="#B8891F"/>
      <stop offset="1" stop-color="#7A5A12"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <style>
      .s { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .serif { font-family: Georgia, 'Times New Roman', 'Liberation Serif', serif; }
      .pulse { transform-origin: 450px 30px; animation: p 3s ease-in-out infinite; }
      @keyframes p { 0%,100% { transform: scale(1); opacity: .8; } 50% { transform: scale(1.25); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <path d="M60 30H420M480 30H840" stroke="url(#l)" stroke-width="1.2"/>
  <g class="pulse"><rect x="443" y="23" width="14" height="14" transform="rotate(45 450 30)" fill="none" stroke="#A67C1A" stroke-width="1.5"/></g>
  <text x="450" y="74" text-anchor="middle" class="serif" font-size="22" font-style="italic" fill="url(#g)">Learn  ·  Build  ·  Repeat</text>
  <text x="450" y="100" text-anchor="middle" class="s" font-size="12" letter-spacing="4" fill="#57606A">THANKS FOR VISITING</text>
</svg>
