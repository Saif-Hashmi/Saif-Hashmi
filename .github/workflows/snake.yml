name: Golden contribution snake

on:
  schedule:
    - cron: "0 0 * * *"   # refresh once a day
  workflow_dispatch:       # run it manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate gold snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/gold-snake.svg?palette=github-dark&color_snake=#F3D78A&color_dots=#161B22,#3B2F12,#6B5420,#A8842C,#D4AF37

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
